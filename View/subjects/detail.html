{% extends "base.html" %}
{% block title %}Ver asignatura{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-start">
  <div>
    <h3 class="mb-1">{{ asig["asig_nom"] }}</h3>
    <div class="text-muted">Código: {{ asig["asig_cod"] }}</div>
  </div>

  <div class="d-flex gap-2">
    <a class="btn btn-outline-primary" href="{{ url_for('subjects.edit_', asig_id=asig['asig_id']) }}">Editar</a>
    <form method="post" action="{{ url_for('subjects.delete_', asig_id=asig['asig_id']) }}"
          onsubmit="return confirm('¿Eliminar esta asignatura?');">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-outline-danger" type="submit">Eliminar</button>
    </form>
  </div>
</div>

<hr>
<a class="btn btn-outline-secondary" href="{{ url_for('subjects.list_') }}">Volver</a>

{% endblock %}
