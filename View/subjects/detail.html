{% extends "base.html" %}
{% block title %}Ver asignatura{% endblock %}
{% block styles %}
  <link href="{{ url_for('static', filename='subjects.css') }}" rel="stylesheet">
{% endblock %}
{% block content %}

<div class="d-flex flex-wrap gap-3 justify-content-between align-items-start subject-detail-head">
  <div>
    <h3 class="mb-1 subject-detail-title">{{ asig["asig_nom"] }}</h3>
    <div class="text-muted subject-detail-code">Código: {{ asig["asig_cod"] }}</div>
  </div>

  <div class="d-flex gap-2 flex-wrap subject-detail-actions">
    <a class="btn btn-outline-primary" href="{{ url_for('subjects.edit_', asig_id=asig['asig_id']) }}">Editar</a>
    <form method="post" action="{{ url_for('subjects.delete_', asig_id=asig['asig_id']) }}"
          onsubmit="return confirm('¿Eliminar esta asignatura?');">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-outline-danger" type="submit">Eliminar</button>
    </form>
  </div>
</div>

<hr>
<a class="btn btn-outline-secondary" href="{{ url_for('subjects.list_') }}">Volver</a>

{% endblock %}
