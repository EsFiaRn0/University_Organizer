{% extends "base.html" %}
{% block title %}Asignaturas{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="m-0">Asignaturas</h3>
  <a class="btn btn-primary" href="{{ url_for('subjects.new_') }}">Crear</a>
</div>

<table class="table table-striped align-middle">
  <thead>
    <tr>
      <th>Código</th>
      <th>Nombre</th>
      <th class="text-end">Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for a in asignaturas %}
    <tr>
      <td>{{ a["asig_cod"] }}</td>
      <td>{{ a["asig_nom"] }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-dark" href="{{ url_for('subjects.view_', asig_id=a['asig_id']) }}">Ver</a>
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('subjects.edit_', asig_id=a['asig_id']) }}">Editar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
